<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Mahasiswa</title>
</head>
<body>
    <h2>Daftar Mahasiswa</h2>
    <input id="nama" placeholder="Nama mahasiswa">
    <button id="tambah">Tambah</button>
    <ul id="daftar"></ul>

    <script>
        const input = document.getElementById("nama");
        const daftar = document.getElementById("daftar");

        function tambahMahasiswa() {
            const nama = input.value.trim();   // ← pakai 'nama' secara konsisten

            if (nama === "") {
                alert("Nama wajib diisi");
                return;
            }

            const item = document.createElement("li");
            item.appendChild(document.createTextNode(nama + " "));

            const tombolHapus = document.createElement("button");
            tombolHapus.textContent = "hapus";
            tombolHapus.addEventListener("click", () => item.remove());

            item.appendChild(tombolHapus);
            daftar.appendChild(item);

            input.value = "";
            input.focus();
        }

        document.getElementById("tambah")
            .addEventListener("click", tambahMahasiswa);

        // Bonus: bisa tekan Enter juga
        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                tambahMahasiswa();
            }
        });
    </script>
</body>
</html>
